# Settings used by the tests. Any of these can be changed from the command line:
#   mvn test -Dbrowser=firefox -Dheadless=true

# Website under test
baseUrl=https://rahulshettyacademy.com/seleniumPractise/#/

# chrome | firefox | edge
browser=chrome

# true = run without opening a browser window
headless=false

# Maximum seconds to wait for an element (explicit wait)
timeout=10
